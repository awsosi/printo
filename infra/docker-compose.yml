version: "3.9"

services:
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @printo/web"
    volumes:
      - ..:/app
    env_file:
      - ../.env.example
    environment:
      - PORT=${WEB_PORT:-3000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run migrate -w @printo/api && npm run dev -w @printo/api"
    volumes:
      - ..:/app
    env_file:
      - ../.env.example
    environment:
      - PORT=${API_PORT:-4000}
      - DATABASE_URL=${DATABASE_URL:-postgres://printo:printo@db:5432/printo}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @printo/worker"
    volumes:
      - ..:/app
    env_file:
      - ../.env.example
    environment:
      - PORT=${WORKER_PORT:-5000}
    ports:
      - "5000:5000"
    depends_on:
      - api
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: printo
      POSTGRES_USER: printo
      POSTGRES_PASSWORD: printo
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printo -d printo"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
