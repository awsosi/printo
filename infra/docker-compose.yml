services:
  web:
    image: node:18
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @printo/web"
    volumes:
      - ..:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_shared_node_modules:/app/packages/shared/node_modules
    env_file:
      - ../.env.example
    environment:
      - PORT=3000
      - API_BASE_URL=${API_BASE_URL:-http://api:4000}
      - WORKER_BASE_URL=${WORKER_BASE_URL:-http://worker:5000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s

  api:
    image: node:18
    working_dir: /app
    command: sh -c "npm install && npm run migrate -w @printo/api && npm run dev -w @printo/api"
    volumes:
      - ..:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - api_shared_node_modules:/app/packages/shared/node_modules
    env_file:
      - ../.env.example
    environment:
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgres://printo:printo@db:5432/printo}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s

  worker:
    image: node:18
    working_dir: /app
    command: >-
      sh -c "apt-get update &&
      apt-get install -y --no-install-recommends smbclient &&
      rm -rf /var/lib/apt/lists/* &&
      npm install &&
      npm run dev -w @printo/worker"
    volumes:
      - ..:/app
      - worker_node_modules:/app/node_modules
      - worker_app_node_modules:/app/apps/worker/node_modules
      - worker_shared_node_modules:/app/packages/shared/node_modules
    env_file:
      - ../.env.example
    environment:
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgres://printo:printo@db:5432/printo}
      - WORKER_STORE=postgres
      - WORKER_SCANNER=${WORKER_SCANNER:-auto}
      - WORKER_DISPATCH_PROVIDER_MODE=${WORKER_DISPATCH_PROVIDER_MODE:-mock}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-60000}
      - WORKER_VISION_URL=${WORKER_VISION_URL:-http://vision:6000}
      - WORKER_CLASSIFIER=${WORKER_CLASSIFIER:-auto}
    ports:
      - "${WORKER_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s

  vision:
    build:
      context: ../services/vision
      args:
        # Set VISION_BUILD_PROFILE=full for pdfium rasterization + zxing barcodes + PaddleOCR.
        BUILD_PROFILE: ${VISION_BUILD_PROFILE:-minimal}
    ports:
      - "${VISION_PORT:-6000}:6000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:6000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: printo
      POSTGRES_USER: printo
      POSTGRES_PASSWORD: printo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printo -d printo"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  pg_data:
  web_node_modules:
  web_app_node_modules:
  web_shared_node_modules:
  api_node_modules:
  api_app_node_modules:
  api_shared_node_modules:
  worker_node_modules:
  worker_app_node_modules:
  worker_shared_node_modules:
